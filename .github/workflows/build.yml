name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths-ignore:
     - '**.md'
     - '**.png'
     - 'deps/cystdf/**.*'
  schedule:
    # 0 → minute 00
    # 3 → hour 03
    # * → every day of month
    # * → every month
    # 0 → Sunday
    - cron: '0 3 * * 0'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-STDF-Viewer:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-15, macos-15-intel]

    steps:
      - uses: actions/checkout@v7

      - name: Detect Runner Image
        id: osinfo
        shell: bash
        run: |
          echo "image_os=${ImageOS:-unknownImg}_$(uname -m)" >> "$GITHUB_OUTPUT"

      # setup uv to handle dependencies
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install Python via uv
        run: |
          uv python install 3.13
          uv venv

      - name: Restore Numpy no BLAS
        id: restore-numpy-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/numpycache
          key: numpy-2.3.4-${{ steps.osinfo.outputs.image_os }}

      # same setup used in numpy repo
      - name: Setup MSVC
        if: runner.os == 'Windows' && steps.restore-numpy-cache.outputs.cache-hit != 'true'
        uses: bus1/cabuild/action/msdevshell@e22aba57d6e74891d059d66501b6b5aed8123c4d  # v1

      - name: Build Numpy no BLAS if no cache
        if: steps.restore-numpy-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o numpy.tar.gz https://github.com/numpy/numpy/releases/download/v2.3.4/numpy-2.3.4.tar.gz
          tar -xzf numpy.tar.gz

          uv pip install meson-python cython build
          uv run --no-sync python -m build --verbose --wheel --outdir "${{ runner.temp }}/numpycache" --config-setting=setup-args=-Dblas=none --config-setting=setup-args=-Dlapack=none ./numpy-2.3.4

      - name: Cache Numpy no BLAS
        if: steps.restore-numpy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/numpycache
          key: numpy-2.3.4-${{ steps.osinfo.outputs.image_os }}

      - name: Add Numpy no BLAS to deps
        shell: bash
        run: |
          local_numpy=$(find "${{ runner.temp }}/numpycache" -name "numpy*.whl" | head -n 1)

          # uv expects windows style path, e.g., c:/xx/xx
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            local_numpy=$(cygpath -m "$local_numpy")
          fi

          uv remove numpy --no-sync --verbose
          uv add "numpy @ file://$local_numpy" --no-sync --verbose

      - name: Install dependencies
        run: |
          uv lock --refresh
          uv sync --dev --verbose
          uv run python -c "import numpy as np; print('NumPy version:', np.__version__); np.__config__.show()"
                    
      - name: Freeze macOS app
        if: runner.os == 'macOS'
        working-directory: .
        run: |
          npm install -g appdmg
          uv run pyinstaller build_tools/macos.spec

      - name: Freeze Linux app
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          # qt issue on linux
          export QT_DEBUG_PLUGINS=1
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libxcb-xinerama0 \
            libxcb-image0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxkbcommon-x11-0 \
            libxcb1 \
            libxcb-randr0 \
            libxcb-shape0
          
          xvfb-run uv run pyinstaller build_tools/linux.spec

      - name: Freeze Windows app
        if: runner.os == 'Windows'
        working-directory: .
        run: |
          uv run pyinstaller build_tools\\windows.spec

      # - name: Clean dist folder
      #   run: |
      #     python build_tools/clean.py

      # - name: Clean dist folder
      #   run: |
      #     rm -rf "./dist/STDF-Viewer"
      #     python build_tools/clean.py

      # macOS
      - name: Build macOS dmg package
        if: runner.os == 'macOS'
        run: |
          mv "dist/STDF Viewer.app" build_tools/STDF-Viewer-emptyDMG
          ls -lahR build_tools/STDF-Viewer-emptyDMG

          appdmg build_tools/STDF-Viewer-emptyDMG/dmg.json build_tools/STDF-Viewer-macos.dmg

      - uses: actions/upload-artifact@v7
        name: Upload macOS app
        if: runner.os == 'macOS'
        with:
          name: STDF_Viewer_${{ matrix.os }}
          path: build_tools/STDF-Viewer-macos.dmg

      # Linux
      - name: Build Linux deb
        if: runner.os == 'Linux'
        run: |
          rm build_tools/STDF-Viewer-emptyDEB/usr/local/bin/placeholder
          cp -avr dist/STDF-Viewer build_tools/STDF-Viewer-emptyDEB/usr/local/bin
          ls -lahR build_tools/STDF-Viewer-emptyDEB
          
          dpkg-deb -vD --build build_tools/STDF-Viewer-emptyDEB
      
      - uses: actions/upload-artifact@v7
        name: Upload Linux app
        if: runner.os == 'Linux'
        with:
          name: STDF_Viewer_${{ matrix.os }}
          path: build_tools/STDF-Viewer-emptyDEB.deb

      # Windows
      - name: Pack Windows app
        if: runner.os == 'Windows'
        run: |
          ls -R dist
          7z a -tzip STDF_Viewer_win.zip dist/

      - uses: actions/upload-artifact@v7
        name: Upload Windows app
        if: runner.os == 'Windows'
        with:
          name: STDF_Viewer_${{ matrix.os }}
          path: STDF_Viewer_win.zip
